<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>EmergenHex</title>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0b0b14;
      }

      #unity-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #0b0b14;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="1280" height="800" tabindex="0"></canvas>
    <script src="Build/EmergenHex.loader.js"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/EmergenHex.data.unityweb",
        frameworkUrl: "Build/EmergenHex.framework.js.unityweb",
        codeUrl: "Build/EmergenHex.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Limited Input",
        productName: "EmergenHex",
        productVersion: "1.0.0"
      }).then(() => canvas.focus()).catch(message => alert(message));
    </script>
  </body>
</html>
